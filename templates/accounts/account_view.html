{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <title>ورود کاربر</title>
  </head>
  <body class="bg-light">
    <!--navbar-->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <img src="{% static 'images/logo.png' %}" alt="" />
        <span class="navbar-brand">سامانه رزرو غذای شرکت هیدروصنعت شریف</span>
      </div>
    </nav>
    <!--main-->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <form class="card p-4 shadow" method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label d-block text-center">نام کاربری</label>
              <input
                class="form-control text-center"
                placeholder="نام کاربری خودرا وارد کنید"
                type="username"
                name="username"
              />
            </div>
            <div class="mb-3">
              <label class="form-label d-block text-center">رمز عبور</label>
              <input
                class="form-control text-center"
                type="password"
                placeholder="رمز خودرا وارد کنید"
                name="password"
              />
            </div>
            <button value="ورود" class="btn btn-primary">login</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
