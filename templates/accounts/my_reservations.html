{% load static %}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
/>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a href="{% url 'home' %}">
      <img src="{% static 'images/logo.png' %}" alt=""
    /></a>

    <div class="navbar-brand">{{user.username}}</div>
    <div class="header_item">
      <a href="{% url 'logout' %}" style="color: white; text-decoration: none"
        >خروج</a
      >
    </div>
    <span class="navbar-brand">سامانه رزرو غذای شرکت هیدروصنعت شریف</span>
  </div>
</nav>

<div class="container mt-5">
  <h3 class="mb-4 text-center">تاریخچه رزروهای من</h3>

  <table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-primary">
      <tr>
        <th>تاریخ</th>
        <th>غذا</th>
        <th>لوکیشن</th>
      </tr>
    </thead>

    <tbody>
      {% for reservation in reservations %}
      <tr>
        <td>{{ reservation.menu.date }}</td>
        <td>{{ reservation.menu.food }}</td>
        <td>{{ reservation.menu.location }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">هیچ رزروی ثبت نشده است.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
