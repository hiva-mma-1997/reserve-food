<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
/>
<h1>{{location}} , {{ today }}</h1>
<div class="container mt-5">
  <form method="post">
    {% csrf_token %}
    <table
      class="table table-bordered table-hover text-center align-middle mt-3"
    >
      <thead class="table-primary">
        <tr>
          <th>No.</th>
          <th class="p-3">روز</th>
          <th class="p-3">تاریخ</th>
          <th class="p-3">غذا</th>
        </tr>
      </thead>
      <tbody>
        {% for item in week_data %}
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.day }}</td>
          <td>{{ item.date }}</td>

          <td>
            <input type="text" name="food_{{ item.date|date:'Y-m-d' }}" />
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <input type="submit" value="ثبت" class="btn btn-primary mt-3" />
  </form>
</div>
