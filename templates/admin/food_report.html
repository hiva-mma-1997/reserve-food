{% load static %}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
/>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <img src="{% static 'images/logo.png' %}" alt="" />
    <span class="navbar-brand">سامانه رزرو غذای شرکت هیدروصنعت شریف</span>
  </div>
</nav>

<h1 class="text-center mt-5">گزارش غذاها</h1>
<div class="container mt-5">
  <table class="table table-bordered table-hover text-center align-middle mt-3">
    <thead class="table-primary">
      <tr>
        <th>روز</th>
        <th>لوکیشن</th>
        <th>تعداد رزرو</th>
      </tr>
    </thead>

    <tbody>
      {% for item in report %}
      <tr>
        <td>{{ item.day }}</td>
        <td>{{ item.location }}</td>
        <td>{{ item.total_reserve }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
