{% load static %}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
/>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a href="{% url 'home' %}"><img src="{% static 'images/logo.png' %}" alt="" /></a>
    
    <span class="navbar-brand">سامانه رزرو غذای شرکت هیدروصنعت شریف</span>
  </div>
</nav>

<div class="container mt-5">
  <form method="post">
    {% csrf_token %}
    <table
      class="table table-bordered table-hover text-center align-middle mt-3"
    >
      <thead class="table-primary">
        <tr>
          <th class="p-3">کد کاربر</th>
          <th class="p-3">نام کاربر</th>
          <th class="p-3">محل</th>
          <th class="p-3">رزرو</th>
        </tr>
      </thead>

      <tbody>
        {% for emp in not_reserved %}
        <tr>
          <td>{{ emp.user.id }}</td>
          <td>{{ emp.user }}</td>
          <td>{{ emp.location }}</td>
          <td>
            {% if  now > admin_reserve_time %}
            <input type="checkbox" name="employees" value="{{ emp.id }}" disabled />
            {% else %}
            <input type="checkbox" name="employees" value="{{ emp.id }}"  />
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <input type="submit" value="ارسال" id="" class="btn btn-primary mt-3" />
  </form>
</div>
